spring.application.name=cardapio
## spring.datasoure.url=jdbc:postgresql://localhost:5432/food
spring.datasoure.username=adm
spring.destasoure.password=password


# Habilita o console web do H2 (acesse via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurações da URL de Conexão (Modo Em Memória)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mantém o banco vivo mesmo se todas as conexões fecharem
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
